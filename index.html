<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurgerHouse</title>
    <link rel="shortcut icon" href="assets/icons/Burger_icon.png" type="image/x-icon">

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/variable.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body onload="init()">
    <header class="header-section">
        <img src="./assets/icons/BestellApp_Logo.png" alt="Bestellapp Logo">
        <img src="./assets/icons/menu_icon.png" alt="Burgermenu Icon">
    </header>
    <main>
        <section class="hero-section">
            <div class="hero-wrapper">
                <img class="hero-image" src="./assets/image/hero_image.webp" alt="Hero Image">
                <img class="restaurant-logo" src="./assets/image/BurgerHouse_Logo.webp" alt="BurgerHouse Logo">
            </div>
            <div class="title-wrapper">
                <h1>
                    <span style="color: var(--main-color)">Burger</span>House
                </h1>
                <img src="./assets/icons/review_icon.png" alt="Restaurant Review">
            </div>
            <p>
                The best of Burgers, Pizza, and Greens, all in one great place.
            </p>
        </section>
        <div class="content-wrapper">
            <section id="menu-content" class="menu-wrapper"></section>
            <section id="basket-content" class="basket-wrapper"></section>
        </div>
    </main>
    <dialog id="nav-basket-content" class="basket-dialog">
        <button onclick="closeNavBasket()" class="button-style">X</button>
    </dialog>
    <dialog id="order-confirmed" class="confirmed-dialog">
        <img src="assets/icons/Order_confirmed_icon.png" alt="Order Confirmed Icon">
        <h2>
            Order confirmed!
        </h2>
        <p>
            Your food is on the way!
        </p>
    </dialog>
    <footer class="footer-section">
        <p>&copy; BurgerHouse</p>
        <a href="#">Imprint</a>
        <a href="#">Cookie Preferences</a>
    </footer>
    <nav id="nav-basket-footer" class="nav-basket">
        <button>
            <img src="assets/icons/home_icon.png" alt="Home Button">
        </button>
        <button>
            <img src="assets/icons/contact_icon.png" alt="Contact Button">
        </button>
        <button>
            <img src="assets/icons/takeout_icon.png" alt="Contact Button">
        </button>
        <button onclick="openNavBasket()">
            <img src="assets/icons/basket_icon.png" alt="Basket Icon">
        </button>
    </nav>
</body>
<script src="./scripts/database.js"></script>
<script src="./scripts/templates.js"></script>
<script src="./script.js"></script>

</html>
